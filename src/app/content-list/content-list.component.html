<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    @if(contentList.length==0){
        <mat-card class="text-center p-4 bg-red-100 rounded-md shadow-md">
            <p class="text-red-500 font-semibold text-lg">
                <a href="/" mat-button color="warn">
                    Product not found! <u>GO Home</u>
                </a>
            </p>
        </mat-card>
    }

    @for (item of contentList; track item){
        @if (item.id%2==0) {
        <mat-card class="border bg-red-100 p-4 rounded-lg shadow-md">
            <app-content-list-item [contentItem]="item" (delete)="onDelete($event)"></app-content-list-item>
        </mat-card>
        }
        @else {
        <mat-card class="border bg-green-100 p-4 rounded-lg shadow-md">
            <app-content-list-item [contentItem]="item" (delete)="onDelete($event)"></app-content-list-item>
        </mat-card>
        }
    }
</div>
