@if (contentItem) {
  <mat-card>
      <a [routerLink]="['/modify', contentItem.id]" mat-button color="primary">
          Edit Product
      </a>

      <button (click)="deleteItem()" mat-raised-button color="warn">
          Delete
      </button>

      <h2 class="text-xl font-semibold mb-2" [appHoverHighlight]="'lightblue'">
          {{ contentItem | ProductFullNamePipe }}
      </h2>
      <p class="text-gray-700 mb-2">{{ contentItem.description | uppercase }}</p>
      <p class="text-gray-700 mb-2">{{ contentItem.price | currency: 'USD':'symbol' }}</p>
      <p class="text-gray-700 mb-1">
          Sale ends on: {{ saleEndDate | date: 'shortDate' }}
      </p>
      <img [src]="contentItem.img" alt="Description for {{ contentItem.name }}" class="w-full h-auto rounded">
  </mat-card>
}
